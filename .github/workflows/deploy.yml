name: Build & Deploy

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    rsigma-wasm:
        name: rsigma-wasm (Rust + JS integration)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Set up Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry & build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rsigma-wasm

            - name: Install dependencies
              run: bun install

            - name: Run rsigma-wasm Rust unit tests
              run: bun run test:wasm

            - name: Install wasm-pack
              uses: jetli/wasm-pack-action@v0.4.0
              with:
                  version: "v0.13.1"

            - name: Rebuild WASM
              run: bun run build:wasm

            # Guard against shipping a `.wasm` that drifts from `lib.rs`. If
            # the rebuild produced anything different from what's committed,
            # the contributor forgot to run `bun run build:wasm` — fail loudly
            # with the diff so they can regenerate locally.
            - name: Check committed pkg/ matches the rebuilt artifact
              run: |
                  if ! git diff --exit-code --stat -- src/lib/rsigma-wasm/pkg/; then
                      echo ""
                      echo "::error::src/lib/rsigma-wasm/pkg/ is out of sync with rsigma-wasm/src. Run 'bun run build:wasm' and commit the result."
                      exit 1
                  fi

            - name: Run Vitest unit tests against the real WASM
              run: bun run test:unit

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Get installed Playwright version
              id: playwright-version
              run: echo "PLAYWRIGHT_VERSION=$(bun pm ls 2>/dev/null | grep '@playwright/test' | sed 's/.*@//')" >> $GITHUB_ENV

            - name: Cache playwright binaries
              uses: actions/cache@v3
              id: playwright-cache
              with:
                  path: |
                      ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}-${{ hashFiles('**/bun.lock') }}

            - name: Install dependencies
              run: bun install

            - name: Install Playwright dependencies
              run: npx playwright install-deps ${{ matrix.browser }}
              if: steps.playwright-cache.outputs.cache-hit != 'true' || matrix.browser == 'webkit'

            - name: Install Playwright browsers
              run: bunx playwright install ${{ matrix.browser }}
              if: steps.playwright-cache.outputs.cache-hit != 'true'

            - name: Clone SigmaHQ rules (shallow)
              run: git clone --depth 1 --single-branch --branch master https://github.com/SigmaHQ/sigma.git .sigma-repo

            - name: Generate Sigma rules index
              run: bun run scripts/generate-sigma-index.ts

            - name: Run Playwright tests for ${{ matrix.browser }}
              run: bun run test --project=${{ matrix.browser }}

    build-and-deploy:
        runs-on: ubuntu-latest
        needs: [test, rsigma-wasm]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install

            - name: Build project
              run: bun -b run build

            - name: Deploy to BunnyCDN
              uses: ayeressian/bunnycdn-storage-deploy@v2.2.5
              with:
                  source: "dist"
                  destination: "/"
                  storageZoneName: "${{ secrets.STORAGE_NAME }}"
                  storagePassword: "${{ secrets.STORAGE_PASSWORD }}"
                  accessKey: "${{ secrets.STORAGE_KEY }}"
                  pullZoneId: "${{ secrets.ZONE_ID }}"
                  upload: "true"
                  remove: "true"
                  purgePullZone: "true"
